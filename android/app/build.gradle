plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.outlands.launcher'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.outlands.launcher'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
